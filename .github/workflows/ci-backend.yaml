name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".tool-versions"
      - ".github/workflows/ci-backend.yaml"

permissions:
  contents: read

# 同じ PR への連続 push で、古い実行を打ち切る
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # ============================================================
  # lint check
  # ============================================================
  # golangci-lint で、Go のコードの整形と書き方に誤りがないかを確かめる
  # gofmt / goimports の整形どおりでないファイルや、linter の指摘が 1 件でもあると失敗する
  # 有効にする linter は backend/.golangci.yaml
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # golangci-lint-action はバージョンをファイルから読めないため、.tool-versions から取り出す
      - name: Read golangci-lint version
        id: versions
        working-directory: .
        run: echo "golangci-lint=v$(awk '$1 == "golangci-lint" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.versions.outputs.golangci-lint }}
          working-directory: backend

  # ============================================================
  # gopls check
  # ============================================================
  # golangci-lint に入っていない gopls の解析 (writestring など) を流す
  # 警告が 1 件でもあると失敗する (処理は backend/scripts/gopls-check.sh)
  # gopls のバージョンは .tool-versions で管理できないため、ここで固定する
  backend-gopls:
    runs-on: ubuntu-latest
    env:
      GOPLS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Install gopls
        run: go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"

      - name: Run gopls check
        run: scripts/gopls-check.sh

  # ============================================================
  # test
  # ============================================================
  # go test を -race 付きで実行する
  # テストが 1 件でも失敗するか、データ競合が見つかると失敗する
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Test
        run: go test -race ./...

  # ============================================================
  # build check
  # ============================================================
  # ECS で動かすのと同じ linux/arm64 のイメージを、push せずにビルドする
  # Dockerfile の誤りや、arm64 向けのクロスコンパイルの失敗があると失敗する
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
