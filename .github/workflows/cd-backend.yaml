name: cd-backend

# v* のタグの push でデプロイする
# ロールバックや再デプロイは workflow_dispatch で、起動時に ref として戻したいタグを選ぶ
#   - deploy 用のロールは v* のタグから発行されたトークンしか信頼しないため、ブランチを選ぶと AWS の認証で失敗する
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# デプロイの起動を 1 つずつ順に行う (途中で打ち切らない)
# ECS のデプロイの完了は待たないため、前のデプロイが進行中のまま次のデプロイが始まることはある
concurrency:
  group: cd-backend
  cancel-in-progress: false

# 名前は infra の modules/ecr と modules/ecs の命名規則 (<env>-amber-...) に合わせる
env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: prd-amber-api
  ECS_CLUSTER: prd-amber
  ECS_SERVICE: prd-amber-api
  TASK_DEFINITION_FAMILY: prd-amber-api
  CONTAINER_NAME: api
  # デプロイを始めたことのイベント (infra の modules/notification の locals と同じ値にする)
  EVENT_SOURCE: amber.cd-backend
  EVENT_DETAIL_TYPE: Deployment Started

jobs:
  # ============================================================
  # deploy
  # ============================================================
  # 1. linux/arm64 でビルドし、ECR に push する (イメージのタグ = Git のタグ)。push 済みのタグなら、ビルドせずにそのイメージを使う
  # 2. ファミリーの最新のタスク定義のイメージを、ダイジェストで指定し直して、新しいリビジョンとして登録する
  #    Terraform で CPU やメモリなどを変えたあとは、今動いているタグで workflow_dispatch を流すと反映される
  # 3. update-service で、Terraform で設定した方式のデプロイを始める。完了は待たない (結果は Slack の通知で確かめる)
  # 4. デプロイを始めたことを、EventBridge 経由で Slack に通知する
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC のトークンを発行して、deploy 用のロールを引き受けるため
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ロールの ARN はリポジトリの Variables (AWS_DEPLOY_ROLE_ARN) に置く
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # ECR はタグの上書きを禁止しているため、同じタグを流し直すとき (ロールバックや再デプロイ) は push しない
      - name: Find pushed image
        id: existing
        run: .github/workflows/scripts/cd-backend/find-image.sh

      - if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance と sbom を付けると、タグの付いたイメージインデックスと、タグなしの子のイメージに分かれる
      # タグなしのイメージは ECR のライフサイクルで 1 日後に消されるため、付けずに 1 つのイメージにする
      - if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # タスク定義に書くイメージを、タグではなくダイジェストで組み立てる (<registry>/<repository>@sha256:...)
      # ダイジェストは、push 済みのタグならそのイメージのもの、この実行で push したならビルドの結果のものを使う
      - name: Resolve image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve the image digest for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "image=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      # ファミリーの最新の ACTIVE なタスク定義を複製し、コンテナのイメージだけを差し替えた新しいリビジョンとして登録する
      - name: Register task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: .github/workflows/scripts/cd-backend/register-task-definition.sh

      # 登録したリビジョンでデプロイを始める。方式 (ローリング、ブルー/グリーンなど) は Terraform のサービスの設定に従う
      # デプロイの完了は待たずに終わる。新しいデプロイの ID を、ログと次のステップに渡す
      - name: Update service
        id: deploy
        env:
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
        run: .github/workflows/scripts/cd-backend/update-service.sh

      # デプロイを始めたことを Slack に通知する (EventBridge 経由。infra の modules/notification)
      # デプロイはもう始まっているため、通知に失敗してもジョブは失敗にしない (警告として残す)
      - name: Notify deploy started
        continue-on-error: true
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
          PUSHED: ${{ steps.existing.outputs.digest == '' }}
        run: .github/workflows/scripts/cd-backend/notify-deploy-started.sh

      # デプロイしたバージョン (Git のタグ)、イメージ、タスク定義を、実行結果のページ (ジョブのサマリー) に表にして残す
      # この実行で push したか (false なら push 済みのイメージを流し直した) も書き、ロールバックの実行と見分けられるようにする
      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
          PUSHED: ${{ steps.existing.outputs.digest == '' }}
        run: .github/workflows/scripts/cd-backend/write-deploy-summary.sh
