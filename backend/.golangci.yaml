version: "2"

linters:
  # standard (errcheck、govet、ineffassign、staticcheck、unused) に加えて有効にする
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - modernize
    - noctx
    - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # このリポジトリのパッケージを、外部のパッケージと別のまとまりにする
      local-prefixes:
        - github.com/tamaco489/amber
